<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="pddLogoTitle">
  <title id="pddLogoTitle">Protector de Derechos Digitales</title>
  <defs>
    <!-- Fondo: degradado rico, más profundo que el rojo plano del widget -->
    <linearGradient id="pdd-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ff7a68"/>
      <stop offset="45%"  stop-color="#e5342f"/>
      <stop offset="100%" stop-color="#8a1a1a"/>
    </linearGradient>

    <!-- Brillo superior, como el vidrio de un icono de macOS/iOS -->
    <radialGradient id="pdd-gloss" cx="50%" cy="16%" r="65%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombreado sutil en el borde inferior, para dar peso -->
    <linearGradient id="pdd-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="pdd-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <filter id="pdd-shield-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#5c0f0f" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle: mismo radio de esquina que usa Apple en sus iconos (~22%) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#pdd-bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#pdd-gloss)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#pdd-vignette)"/>

  <!-- Escudo, con una sombra suave para levantarlo del fondo -->
  <g filter="url(#pdd-shield-shadow)">
    <path d="M256 105.9 L374.5 153.3 V248.1 C374.5 327.1 319.2 382.4 256 406.1
             C192.8 382.4 137.5 327.1 137.5 248.1 V153.3 Z"
          fill="url(#pdd-shield)"/>
  </g>

  <!-- Marca de verificación -->
  <path d="M205 265 L242 302 L322 210"
        fill="none" stroke="#c62828" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
